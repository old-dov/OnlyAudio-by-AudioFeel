name: Build Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: v2.5.0-beta.2)'
        required: true
        default: 'v2.5.0-beta.2'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev libmediainfo-dev

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build Linux release
        run: flutter build linux --release

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package Linux bundle
        run: |
          mkdir -p dist/OnlyAudio
          cp -a build/linux/x64/release/bundle/. dist/OnlyAudio/
          cp docs/linux_build.md dist/OnlyAudio/README-Linux.md
          tar -C dist -czf "OnlyAudio-Linux-x86_64-${{ steps.version.outputs.tag }}.tar.gz" OnlyAudio

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnlyAudio-Linux-x86_64-${{ steps.version.outputs.tag }}
          path: OnlyAudio-Linux-x86_64-${{ steps.version.outputs.tag }}.tar.gz

      - name: Add artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OnlyAudio ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: OnlyAudio-Linux-x86_64-${{ steps.version.outputs.tag }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
